name: Plugin quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qml-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Check Go, JavaScript, and shell sources
        run: ./scripts/check-plugin-quality.sh

      - name: Lint and check QML in the pinned toolchain
        run: ./scripts/check-qml-quality.sh
