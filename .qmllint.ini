[General]
# Keep the host-context warning baseline visible; enforce selected categories below.
MaxWarnings=-1

[Warnings]
# Fail on high-confidence correctness issues and risky constructs.
AccessSingletonViaObject=error
AliasCycle=error
AssignmentInCondition=error
Comma=error
ComponentChildrenCount=error
ConfusingExpressionStatement=error
Deprecated=error
DuplicateEnumEntries=error
DuplicateImport=error
DuplicateInlineComponent=error
DuplicatePropertyBinding=error
DuplicatedName=error
EnumEntryMatchesEnum=error
EnumsAreNotTypes=error
Eval=error
ImportFailure=error
IncompatibleType=error
InheritanceCycle=error
InvalidLintDirective=error
MissingEnumEntry=error
MissingType=error
NonListProperty=error
NonRootEnum=error
PropertyOverride=error
Quick.Anchors=error
Quick.AttachedPropertyType=error
Quick.Color=error
Quick.LayoutsPositioning=error
Quick.StateNoChildItem=error
Quick.UnexpectedVarType=error
ReadOnlyProperty=error
RequiredProperty=error
Shadow=error
UncreatableType=error
UnreachableCode=error
UnresolvedAlias=error
UnresolvedType=error
UnterminatedCase=error
UnusedImports=error
VarUsedBeforeDeclaration=error

# Keep known host/dynamic warnings visible but non-blocking.
BadSignalHandlerParameters=warning
MissingProperty=warning
UnqualifiedAccess=warning
UseProperFunction=warning
