[General]
UseTabs=false
IndentWidth=4
NewlineType=unix
# Keep import precedence explicit; sorting imports can change QML type resolution.
SortImports=false
# Keep QML object properties and handlers in a consistent order.
NormalizeOrder=true
# Leave long bindings under developer control; auto-wrapping splits nested expressions awkwardly.
MaxColumnWidth=-1
SemicolonRule=always
